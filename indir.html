<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pruva Business — İndir</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#fff;--t:#0E1838;--s:#5b6478;--b:#1E3A8A}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1020;--t:#eef1f8;--s:#9aa3b8;--b:#4C6FE0}}
  body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 -apple-system,system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;text-align:center}
  main{max-width:360px;width:100%}
  img{width:72px;height:72px}
  h1{font-size:22px;margin:12px 0 4px}
  p{color:var(--s);margin:0 0 24px}
  a.btn{display:block;padding:14px;border-radius:12px;background:var(--b);color:#fff;text-decoration:none;font-weight:600;margin:10px 0}
  a.link{color:var(--s);font-size:14px}
</style>
</head>
<body>
<main>
  <img src="pruva-logo-transparent.png" alt="">
  <h1>Pruva Business</h1>
  <p id="sub">İşletmenizi ücretsiz dijitalleştirin</p>
  <a class="btn" id="ios" href="https://apps.apple.com/app/id6784718310">App Store</a>
  <a class="btn" id="and" href="https://play.google.com/store/apps/details?id=com.pruva.business&referrer=utm_source%3Dreceipt">Google Play</a>
  <a class="link" id="more" href="/">pruvabusiness.com</a>
</main>
<script>
// Fişteki QR buraya gelir: telefon türüne göre doğrudan mağazaya yönlendir,
// bilgisayarda iki düğme görünür kalır.
(function(){
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  if (!/^tr/i.test(navigator.language || "")) {
    document.documentElement.lang = "en";
    document.getElementById("sub").textContent = "Digitize your business for free";
    document.title = "Pruva Business — Download";
  }
  var target = isIOS ? "ios" : isAndroid ? "and" : null;
  if (target) location.replace(document.getElementById(target).href);
})();
</script>
</body>
</html>
